<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Telegram Alerts</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f9fafb;
      margin: 0;
      padding: 0;
    }
    .status {
      background: #020617;
      padding: 8px 16px;
      font-size: 14px;
      border-bottom: 1px solid #1e293b;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .hidden {
      display: none;
    }
    .alert-box {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: min(90vw, 600px);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fbbf24;
    }
    .message {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }
    .queue {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 12px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      margin-bottom: 8px;
    }
    label {
      font-size: 13px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      background: linear-gradient(to right, #facc15, #f97316);
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="status">
    🔔 Подключено к серверу уведомлений
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="alert-box">
      <div class="title">Новое сообщение Telegram</div>
      <div class="queue">В очереди ещё: <span id="queue-count">0</span></div>
      <div class="message" id="message-text">Текст сообщения...</div>

      <label>Ваше имя:</label>
      <input id="user-name" type="text" placeholder="Введите имя" />
      <div class="row">
        <input id="confirm-checkbox" type="checkbox" />
        <label for="confirm-checkbox">Я прочитал(а) сообщение и беру в работу</label>
      </div>
      <button id="confirm-btn" disabled>✅ Подтвердить</button>
    </div>
  </div>

  <script>
    const socket = io();

    // Элементы
    const overlay = document.getElementById("overlay");
    const messageText = document.getElementById("message-text");
    const queueCountEl = document.getElementById("queue-count");
    const userNameInput = document.getElementById("user-name");
    const confirmCheckbox = document.getElementById("confirm-checkbox");
    const confirmBtn = document.getElementById("confirm-btn");

    // Очередь сообщений
    const alertQueue = [];
    let currentAlert = null;
    let isShowing = false;

    function updateQueueCount() {
      queueCountEl.textContent = alertQueue.length;
    }

    function showOverlay(alert) {
      currentAlert = alert;
      messageText.textContent = alert.message_text || "[Без текста]";
      overlay.classList.remove("hidden");
      userNameInput.value = "";
      confirmCheckbox.checked = false;
      confirmBtn.disabled = true;
      isShowing = true;
      updateQueueCount();
    }

    function hideOverlay() {
      overlay.classList.add("hidden");
      currentAlert = null;
      isShowing = false;
      updateQueueCount();
    }

    function showNextAlertIfAny() {
      if (alertQueue.length > 0) {
        const next = alertQueue.shift();
        showOverlay(next);
      } else {
        hideOverlay();
      }
      updateQueueCount();
    }

    function canConfirm() {
      return (
        currentAlert &&
        userNameInput.value.trim().length > 0 &&
        confirmCheckbox.checked
      );
    }

    userNameInput.addEventListener("input", () => {
      confirmBtn.disabled = !canConfirm();
    });

    confirmCheckbox.addEventListener("change", () => {
      confirmBtn.disabled = !canConfirm();
    });

    confirmBtn.addEventListener("click", () => {
      if (!currentAlert) return;
      const name = userNameInput.value.trim();
      socket.emit("alert_confirmed", {
        message_id: currentAlert.message_id,
        user_name: name,
      });
      showNextAlertIfAny();
    });

    // Новый алерт от сервера
    socket.on("new_alert", (data) => {
      console.log("NEW ALERT:", data);
      alertQueue.push(data);
      updateQueueCount();
      if (!isShowing) {
        showNextAlertIfAny();
      }
    });

    socket.on("connect", () => {
      console.log("Socket connected");
    });
  </script>

</body>
</html>
